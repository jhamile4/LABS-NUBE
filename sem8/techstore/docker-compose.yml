services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    # El backend parece funcionar bien, podemos dejar sus volumes si quieres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # Quitamos los volumes del frontend para que no haya conflictos